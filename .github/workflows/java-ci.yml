name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile, run tests, and package
        run: mvn --batch-mode verify
      - name: Test generic Eaglercraft injector
        run: node --test client-profiles/eaglercraft-1.12-js/inject-gold-client.test.cjs
      - name: Test live player-stat bridge injection
        run: node --test bridge-proof/test-injector.cjs
